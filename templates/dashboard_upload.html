<!DOCTYPE html>
<html lang="en">
<head>
    <title>ADHD Detection Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f5f7fb; }
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: #1f2d3d;
            color: white;
            padding: 20px;
        }
        .sidebar h4 { margin-bottom: 30px; }
        .sidebar a {
            display: block;
            color: #cfd8dc;
            margin: 15px 0;
            text-decoration: none;
        }
        .sidebar a.active { color: #00e5ff; }
        .content {
            margin-left: 260px;
            padding: 40px;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .btn-main {
            background: #1e88e5;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h4>🧠 ADHD AI</h4>
    <a class="active">📤 Upload Image</a>
    <a>👁 Preview</a>
    <a>📊 Result</a>
</div>

<div class="content">
    <div class="card p-4">
        <h3>Step 1: Upload Child Activity Image</h3>
        <p class="text-muted">AI-based early behavioral screening</p>

        <form action="/preview" method="post" enctype="multipart/form-data">
            <input type="file" name="image" class="form-control mb-3" required>
            <button class="btn btn-main">Continue →</button>
        </form>
    </div>
</div>

</body>
</html>
