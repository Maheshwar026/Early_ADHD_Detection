<!DOCTYPE html>
<html>
<head>
    <title>AI Lab – Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }
        .card {
            margin-top: 70px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .image-container {
            display: flex;
            justify-content: center;
        }
        .image-container img {
            max-width: 380px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .confidence-bar {
            height: 26px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card p-4 text-center">

        <h2>📊 AI Analysis Result</h2>

        <div class="image-container my-3">
            <img src="{{ url_for('static', filename='uploaded.jpg') }}">
        </div>

        <div class="alert alert-info">
            {{ result|safe }}
        </div>

        <!-- ✅ DYNAMIC CONFIDENCE -->
        <div class="mt-4">
            <label><b>Model Confidence: {{ confidence }}%</b></label>
            <div class="progress confidence-bar">
                <div class="progress-bar bg-success"
                     style="width: {{ confidence }}%">
                    {{ confidence }}%
                </div>
            </div>
        </div>

        <a href="/" class="btn btn-success mt-4">Analyze New Image</a>

        <p class="text-muted mt-4">
            ⚠ Early behavioral screening only. Not a clinical diagnosis.
        </p>

    </div>
</div>

</body>
</html>
