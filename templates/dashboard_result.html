<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f5f7fb; }
        .content { margin-left:260px; padding:40px; }
        .sidebar {
            width:240px; height:100vh; position:fixed;
            background:#1f2d3d; color:white; padding:20px;
        }
        img {
            max-width: 400px;
            border-radius: 16px;
        }
        .result-box {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h4>🧠 ADHD AI</h4>
    <a>📤 Upload Image</a>
    <a>👁 Preview</a>
    <a class="active">📊 Result</a>
</div>

<div class="content">
    <div class="card p-4 text-center">
        <h3>Step 3: Analysis Result</h3>

        <img src="{{ url_for('static', filename='uploaded.jpg') }}" class="my-3">

        <div class="alert alert-success result-box">
            {{ result }}
        </div>

        <a href="/" class="btn btn-success mt-3">Analyze Another Image</a>

        <p class="text-muted mt-4">
            ⚠ Early behavioral screening only. Not a medical diagnosis.
        </p>
    </div>
</div>

</body>
</html>
