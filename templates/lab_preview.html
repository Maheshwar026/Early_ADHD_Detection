<!DOCTYPE html>
<html>
<head>
    <title>AI Lab – Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
        }

        .card {
            margin-top: 80px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* ✅ CENTER IMAGE PERFECTLY */
        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container img {
            max-width: 420px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .loader {
            display: none;
        }
    </style>

    <script>
        function startAnalysis() {
            document.getElementById("loader").style.display = "block";
        }
    </script>
</head>

<body>

<div class="container">
    <div class="card p-4 text-center">

        <h3>🔬 Step 2 of 3 — Verify Input</h3>
        <p class="text-muted">Please confirm the uploaded image before analysis</p>

        <!-- ✅ CENTERED IMAGE -->
        <div class="image-container my-4">
            <img src="{{ url_for('static', filename='uploaded.jpg') }}">
        </div>

        <form action="/predict" method="post" onsubmit="startAnalysis()">
            <button class="btn btn-primary btn-lg">Run AI Analysis 🚀</button>
        </form>

        <!-- LOADER -->
        <div id="loader" class="loader mt-4">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2">AI model analyzing pose patterns…</p>
        </div>

    </div>
</div>

</body>
</html>
