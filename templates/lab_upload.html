<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Lab – ADHD Risk Screening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* ✅ SMALL CENTERED CARD */
        .upload-card {
            width: 420px;              /* controls box width */
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            padding: 35px;
            text-align: center;
        }

        .step {
            color: #00e5ff;
            font-weight: bold;
        }

        .btn-main {
            background: #00c6ff;
            border: none;
            font-weight: bold;
        }

        .btn-main:hover {
            background: #00acc1;
        }

        input[type="file"] {
            background: white;
        }
    </style>
</head>
<body>

<div class="upload-card">

    <h3>🧠 AI Behavioral Analysis Lab</h3>
    <p class="step">Step 1 of 3 — Upload Image</p>

    <form action="/preview" method="post" enctype="multipart/form-data">
        <input type="file" name="image" class="form-control my-4" required>
        <button class="btn btn-main btn-lg w-100">Continue →</button>
    </form>

    <p class="text-muted mt-4">
        Early behavioral screening using pose-based AI
    </p>

</div>

</body>
</html>
