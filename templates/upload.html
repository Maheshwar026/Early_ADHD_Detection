<!DOCTYPE html>
<html>
<head>
    <title>ADHD Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .card {
            padding: 40px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .btn-custom {
            background: #00c6ff;
            border: none;
            padding: 10px 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card text-center">
    <h2>🧠 Early ADHD Risk Screening</h2>
    <p class="mb-4">Upload child activity image for analysis</p>

    <form action="/preview" method="post" enctype="multipart/form-data">
        <input class="form-control mb-3" type="file" name="image" required>
        <button class="btn btn-custom">Next →</button>
    </form>
</div>

</body>
</html>
