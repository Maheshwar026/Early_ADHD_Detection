<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f7; }
        .result-card {
            margin-top: 60px;
            padding: 30px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .progress {
            height: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="result-card text-center">

        <h2>🧾 Analysis Result</h2>

        <img src="{{ url_for('static', filename='uploaded.jpg') }}" 
             class="img-fluid rounded my-4" style="max-width:400px;">

        <div class="alert alert-info">
            {{ result }}
        </div>

        <a href="/" class="btn btn-success mt-3">Analyze Another Image</a>

        <hr>
        <p class="text-muted">
            ⚠ This system provides early behavioral screening only.
            It is not a clinical diagnosis tool.
        </p>

    </div>
</div>

</body>
</html>
